network:
  version: 2
  renderer: networkd
  ethernets:
    ens18:
      dhcp4: true

    # Interface 1
    node01:
      match:
        macaddress: "AA:14:00:17:00:00"
      set-name: eth0
      addresses:
        - 10.0.40.170/24

    # Interface 2
    node02:
      match:
        macaddress: "AA:11:00:17:00:00"
      set-name: eth1
      addresses:
        - 10.0.10.170/24
      routes:
        - to: 10.0.20.0/24
          via: 10.0.10.1
