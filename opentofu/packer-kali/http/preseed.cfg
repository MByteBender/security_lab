# Kali Linux Debian Installer Preseed
# Passed to the installer via: preseed/file=/cdrom/preseed.cfg

# -----------------------------------------------------------------------
# Locale & Keyboard
# -----------------------------------------------------------------------
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# -----------------------------------------------------------------------
# Network
# -----------------------------------------------------------------------
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string kali
d-i netcfg/get_domain string

# -----------------------------------------------------------------------
# Mirror — Kali rolling repo
# -----------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string http.kali.org
d-i mirror/http/directory string /kali
d-i mirror/suite string kali-rolling
d-i mirror/http/proxy string

# -----------------------------------------------------------------------
# Clock & Timezone
# -----------------------------------------------------------------------
d-i clock-setup/utc boolean true
d-i time/zone string UTC

# -----------------------------------------------------------------------
# Disk partitioning — guided LVM on entire first disk
# -----------------------------------------------------------------------
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-lvm/guided_size string max
d-i partman/default_filesystem string ext4
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm_nooverwrite boolean true

# -----------------------------------------------------------------------
# User — root login disabled; kali user gets passwordless sudo
# -----------------------------------------------------------------------
d-i passwd/root-login boolean false
d-i passwd/user-fullname string kali
d-i passwd/username string kali
d-i passwd/user-password password kali
d-i passwd/user-password-again password kali
d-i passwd/user-default-groups string sudo audio cdrom dip floppy video plugdev netdev bluetooth scanner

# -----------------------------------------------------------------------
# APT — enable non-free and contrib components
# -----------------------------------------------------------------------
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/disable-cdrom-entries boolean true

# -----------------------------------------------------------------------
# Package selection
# kali-linux-headless: headless tool suite (no desktop) — keeps the
# template lean; add kali-linux-default if a GUI is desired.
# -----------------------------------------------------------------------
tasksel tasksel/first multiselect none
d-i pkgsel/include string openssh-server kali-linux-headless
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# -----------------------------------------------------------------------
# GRUB
# -----------------------------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# -----------------------------------------------------------------------
# Finish
# -----------------------------------------------------------------------
d-i finish-install/reboot_in_progress note
